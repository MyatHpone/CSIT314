name: Renovation Match CI/CD

on:
  push:
  pull_request:

jobs:
  # ---------------- Continuous Integration: every push and pull request ----------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renovation_match_platform/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test (start the app and call /api/health)
        run: |
          python -m app.main &
          sleep 5
          curl -fsS http://127.0.0.1:5000/api/health

  # ---------------- Continuous Delivery: only after tests pass on main ----------------
  deliver:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package release
        run: |
          cd renovation_match_platform
          zip -r ../renovation_match_platform_release.zip backend frontend README.md \
            -x "*/__pycache__/*" "*.db" "*/.venv/*"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: renovation-match-release
          path: renovation_match_platform_release.zip
      - name: Trigger deployment (Render deploy hook)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
            echo "Deployment triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping deployment"
          fi
