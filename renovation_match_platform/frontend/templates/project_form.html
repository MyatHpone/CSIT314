{% extends "base.html" %}{% block title %}{{ 'Edit' if row else 'Create' }} project{% endblock %}
{% block content %}<h1 class="h2">{{ 'Edit project' if row else 'Create project' }}</h1><form method="post" class="card card-body form-card">
<div class="mb-3"><label class="form-label">Company</label><select class="form-select" name="company_id" required>{% for c in companies %}<option value="{{ c.id }}" {% if row and row.company_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="mb-3"><label class="form-label">Category</label><select class="form-select" name="category_id"><option value="">No category</option>{% for c in categories %}<option value="{{ c.id }}" {% if row and row.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="mb-3"><label class="form-label">Project title</label><input class="form-control" name="title" required value="{{ row.title if row else '' }}"></div>
<div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="4" name="description">{{ row.description if row else '' }}</textarea></div>
<div class="row g-3"><div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ row.location if row else '' }}"></div><div class="col-md-4"><label class="form-label">Budget (SGD)</label><input class="form-control" type="number" min="0" step="100" name="budget" value="{{ row.budget if row else 0 }}"></div><div class="col-md-4"><label class="form-label">Portfolio status</label><select class="form-select" name="status"><option value="CURRENT" {% if not row or row.status=='CURRENT' %}selected{% endif %}>Current</option><option value="PAST" {% if row and row.status=='PAST' %}selected{% endif %}>Past</option></select></div></div>
<div class="mt-3"><label class="form-label">Image URL (optional)</label><input class="form-control" type="url" name="image_url" value="{{ row.image_url if row else '' }}"></div>
<div class="mt-3"><button class="btn btn-primary">Save project</button> <a class="btn btn-outline-secondary" href="{{ url_for('view_project.projects') }}">Cancel</a></div></form>{% endblock %}
