{% extends "base.html" %}{% block title %}Edit company{% endblock %}
{% block content %}<h1 class="h2">Edit company</h1><form method="post" class="card card-body form-card">
{% for key,label in [('name','Company name'),('email','Email'),('phone','Phone'),('address','Address'),('website','Website')] %}<div class="mb-3"><label class="form-label">{{ label }}</label><input class="form-control" name="{{ key }}" value="{{ row[key] or '' }}" {% if key=='name' %}required{% endif %}></div>{% endfor %}
<div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description">{{ row.description }}</textarea></div><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('view_company.companies') }}">Cancel</a></form>{% endblock %}
