{% extends "base.html" %}{% block title %}{{ 'Edit' if row else 'Create' }} category{% endblock %}
{% block content %}<h1 class="h2">{{ 'Edit category' if row else 'Create category' }}</h1><form method="post" class="card card-body form-card"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required value="{{ row.name if row else '' }}"></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description">{{ row.description if row else '' }}</textarea></div><button class="btn btn-primary">Save category</button> <a class="btn btn-outline-secondary" href="{{ url_for('view_category.categories') }}">Cancel</a></form>{% endblock %}
